<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div id="toast"></div>

<div class="container">

    <h1>Expense Tracker</h1>

    <button id="logoutBtn">
    🚪 Logout
</button>

<button id="changePasswordBtn">
    🔐 Change Password
</button>

<div class="profile-box">

    <h3>👤 My Profile</h3>

    <p>
        <strong>Name:</strong>
        <span id="profileName">-</span>
    </p>

    <button id="editProfileBtn">
    ✏️ Edit Name
</button>

    <p>
        <strong>Email:</strong>
        <span id="profileEmail">-</span>
    </p>

</div>

<div class="change-password-box">

    <!-- Security / Change Password -->

<div class="security-box">

    <button
        id="securityToggle"
        class="security-header"
        type="button">

        <span>🔐 Security</span>

        <span id="securityArrow">▼</span>

    </button>


    <div
        id="securityContent"
        class="security-content">

        <label for="oldPassword">
            Current Password
        </label>

        <div class="password-field">

            <input
                type="password"
                id="oldPassword"
                placeholder="Enter Current Password">

            <button
                type="button"
                class="eye-btn"
                onclick="togglePassword('oldPassword', this)">
                👁
            </button>

        </div>


        <label for="newPassword">
            New Password
        </label>

        <div class="password-field">

            <input
                type="password"
                id="newPassword"
                placeholder="Enter New Password">

            <button
                type="button"
                class="eye-btn"
                onclick="togglePassword('newPassword', this)">
                👁
            </button>

        </div>


        <label for="confirmNewPassword">
            Confirm New Password
        </label>

        <div class="password-field">

            <input
                type="password"
                id="confirmNewPassword"
                placeholder="Confirm New Password">

            <button
                type="button"
                class="eye-btn"
                onclick="togglePassword('confirmNewPassword', this)">
                👁
            </button>

        </div>


        <button
            id="updatePasswordBtn"
            type="button">

            🔐 Update Password

        </button>


        <p id="passwordMessage"></p>

    </div>

</div>

</div>

    <button id="themeBtn">
    🌙 Dark Mode
</button>


    <!-- Balance -->

    <div class="balance-box">

        <h3>Your Balance</h3>

        <h2 id="balance">₹0.00</h2>

    </div>


    <!-- Income & Expense -->

    <div class="summary">

        <div class="income">

            <h4>Income</h4>

            <p id="income">₹0.00</p>

        </div>


        <div class="expense">

            <h4>Expense</h4>

            <p id="expense">₹0.00</p>

        </div>

    </div>


    <!-- Dashboard -->

    <div class="dashboard">

        <div class="dashboard-card">

            <h4>Total Transactions</h4>

            <p id="totalTransactions">0</p>

        </div>


        <div class="dashboard-card">

            <h4>Latest Transaction</h4>

            <p id="latestTransaction">None</p>

        </div>

    </div>


    <!-- Expense Chart -->

    <div class="chart-box">

        <h3>Expense Overview</h3>

        <canvas id="expenseChart"></canvas>

    </div>
    <!-- Monthly Report -->

<div class="report-box" id="monthlyReport"></div>

    <h3>Monthly Report</h3>

    <input
        type="month"
        id="reportMonth">

    <div class="report-summary">

        <div>
            <h4>Income</h4>
            <p id="reportIncome">₹0</p>
        </div>

        <div>
            <h4>Expense</h4>
            <p id="reportExpense">₹0</p>
        </div>

        <div>
            <h4>Balance</h4>
            <p id="reportBalance">₹0</p>
        </div>

        <div>
            <h4>Transactions</h4>
            <p id="reportTransactions">0</p>
        </div>

    </div>

</div>

    <!-- Budget Section -->

<div class="budget-box">

    <h3>Monthly Budget</h3>

    <input
        type="number"
        id="budgetLimit"
        placeholder="Enter Budget">

    <button id="saveBudget">
        Save Budget
    </button>

    <p id="budgetMessage">
        No budget set
    </p>

    <div class="progress-container">

        <div id="progressBar"></div>

    </div>

</div>


    <!-- Add Transaction -->

    <div class="transaction-form">

        <h3>Add Transaction</h3>


        <input
            type="text"
            id="text"
            placeholder="Enter Description">


        <input
            type="number"
            id="amount"
            placeholder="Enter Amount">


        <!-- Category -->

        <select id="category">

            <option value="Food">🍔 Food</option>

            <option value="Shopping">🛍 Shopping</option>

            <option value="Travel">✈️ Travel</option>

            <option value="Salary">💰 Salary</option>

            <option value="Bills">📄 Bills</option>

            <option value="Other">📦 Other</option>

        </select>


        <!-- Date -->

        <input
            type="date"
            id="date">


        <!-- Transaction Type -->

        <select id="type">

            <option value="income">Income</option>

            <option value="expense">Expense</option>

        </select>


        <!-- Add Button -->

        <button id="addBtn">

            Add Transaction

        </button>

    </div>


    <!-- Search -->

    <input
        type="text"
        id="search"
        placeholder="Search Transaction">


    <!-- Filter -->

    <select id="filter">

        <option value="all">All</option>

        <option value="income">Income</option>

        <option value="expense">Expense</option>

    </select>


    <!-- Transaction History -->

    <div class="history">

        <button id="exportBtn">
    📥 Export CSV
</button>

        <h3>History</h3>

        <ul id="list">

        </ul>

    </div>


</div>


<!-- Chart.js -->

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Bottom Navigation -->
<nav class="bottom-nav">

    <button class="nav-item active" id="navHome">
        🏠
        <span>Home</span>
    </button>

    <button class="nav-item" id="navTransactions">
        💳
        <span>Transactions</span>
    </button>

    <button
    class="nav-item"
    id="navReports"
    type="button"
    onclick="document.getElementById('monthlyReport').scrollIntoView({ behavior: 'smooth', block: 'start' });">

    📊
    <span>Reports</span>

</button>

    <button class="nav-item" id="navProfile">
        👤
        <span>Profile</span>
    </button>

</nav>


<!-- JavaScript -->
 <script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
        navigator.serviceWorker.register("./service-worker.js")
            .then(function () {
                console.log("Service Worker registered");
            })
            .catch(function (error) {
                console.error("Service Worker registration failed:", error);
            });
    });
}
</script>

<script src="script.js"></script>


</body>

</html>
